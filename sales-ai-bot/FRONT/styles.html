<style>
  :root{
    --steel:#26326A; --steel-600:#1c2551; --steel-50:#eef0f8; --electric:#283A8F;
    --ink-900:#221F20; --ink-700:#4a4750; --ink-500:#726e78; --ink-300:#aaa7b0;
    --ink-200:#dcdae1; --ink-100:#eeecf1; --ink-50:#f6f6f9; --surface:#ffffff;
    --st-blue:#283A8F; --st-orange:#e8830a; --st-green:#1c8a4b; --st-gray:#8b8996; --st-red:#d64545;
    --aws:#FF9900; --azure:#0078D4; --gcp:#E14134; --signal:#3DD9F5; --whatsapp:#25D366;
    --r-ctrl:8px; --r-panel:12px; --r-card:16px; --r-pill:999px;
    --grad-steel:linear-gradient(135deg,var(--steel) 0%,var(--electric) 100%);
    --shadow-sm:0 1px 2px rgba(12,16,36,.08);
    --shadow-md:0 6px 16px rgba(12,16,36,.12);
    --shadow-lg:0 10px 28px rgba(12,16,36,.16);
    --shadow-brand:0 8px 20px rgba(38,50,106,.28);
    --ease-in:cubic-bezier(.2,.6,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --nav-h:76px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--ink-50); color:var(--ink-900); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--steel); text-decoration:none;}
  a:hover{color:var(--electric); text-decoration:underline;}
  h1,h2,h3,h4{margin:0; letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  .container{max-width:1240px; margin:0 auto; padding:0 20px;}
  .page{padding:28px 0 64px;}
  .page-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-header h1{font-size:24px; font-weight:800;}
  .page-header .subtitle{font-size:13.5px; color:var(--ink-500); margin-top:4px;}
  .page-header .actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:var(--r-ctrl);
    font-weight:700; font-size:13.5px; padding:10px 18px; cursor:pointer; transition:background .14s var(--ease-in), transform .1s var(--ease-in), box-shadow .14s var(--ease-in);
    background:var(--ink-100); color:var(--ink-700); white-space:nowrap;}
  .btn:hover{background:var(--ink-200);}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.55; cursor:default; transform:none;}
  .btn-primary{background:var(--steel); color:#fff; box-shadow:var(--shadow-brand);}
  .btn-primary:hover{background:var(--steel-600);}
  .btn-secondary{background:#fff; color:var(--ink-700); border:1px solid var(--ink-200);}
  .btn-secondary:hover{background:var(--steel-50);}
  .btn-success{background:var(--st-green); color:#fff;}
  .btn-success:hover{filter:brightness(.92);}
  .btn-danger{background:var(--st-red); color:#fff;}
  .btn-danger:hover{filter:brightness(.92);}
  .btn-sm{padding:6px 12px; font-size:12px; border-radius:7px;}
  .icon-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--ink-200); background:#fff; color:var(--ink-700);
    display:inline-flex; align-items:center; justify-content:center; transition:background .14s var(--ease-in);}
  .icon-btn:hover{background:var(--ink-100);}
  .icon-btn svg{width:16px; height:16px;}

  /* ---------- Cards / layout ---------- */
  .card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--r-card); box-shadow:var(--shadow-sm); padding:20px;}
  .card--hover{transition:transform .22s var(--ease-in), box-shadow .22s var(--ease-in);}
  .card--hover:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .grid-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:22px;}
  .stat-card{background:#fff; border:1px solid var(--ink-200); border-radius:var(--r-card); box-shadow:var(--shadow-sm); padding:18px 20px;}
  .stat-card .stat-label{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-500);}
  .stat-card .stat-value{font-size:28px; font-weight:800; letter-spacing:-.02em; margin-top:6px;}
  .stat-card .stat-sub{font-size:12px; color:var(--ink-500); margin-top:2px;}

  /* ---------- Filters / toolbar ---------- */
  .filters-bar{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; background:#fff; border:1px solid var(--ink-200);
    border-radius:var(--r-panel); padding:14px 16px; margin-bottom:18px;}
  .filters-bar .field{display:flex; flex-direction:column; gap:5px; min-width:120px;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}

  /* ---------- Forms ---------- */
  label.field-label{font-size:12px; font-weight:700; color:var(--ink-700); letter-spacing:.01em;}
  .input, select.select, textarea.textarea{
    width:100%; padding:9px 12px; border:1px solid var(--ink-200); border-radius:var(--r-ctrl);
    background:var(--ink-50); font-size:13.5px; color:var(--ink-900); font-family:inherit;
    transition:border-color .14s var(--ease-in), background .14s var(--ease-in); outline:none;}
  .input:focus, select.select:focus, textarea.textarea:focus{border-color:var(--steel); background:#fff; box-shadow:0 0 0 3px rgba(61,217,245,.45);}
  textarea.textarea{resize:vertical; line-height:1.5;}
  .field-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px;}

  /* ---------- Switch ---------- */
  .switch{position:relative; display:inline-block; width:40px; height:22px; flex:0 0 auto;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .slider{position:absolute; inset:0; background:var(--ink-200); border-radius:999px; cursor:pointer; transition:background .14s var(--ease-in);}
  .switch .slider:before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%;
    box-shadow:var(--shadow-sm); transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
  .switch input:checked + .slider{background:var(--steel);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  /* ---------- Segmented control ---------- */
  .segmented{display:inline-flex; background:var(--ink-100); border-radius:var(--r-pill); padding:3px; gap:2px;}
  .segmented button{border:none; background:transparent; font-size:12px; font-weight:700; padding:7px 14px; border-radius:var(--r-pill);
    color:var(--ink-700); cursor:pointer; transition:background .14s var(--ease-in), color .14s var(--ease-in);}
  .segmented button.is-active{background:var(--steel); color:#fff; box-shadow:var(--shadow-sm);}
  .segmented button:disabled{opacity:.6; cursor:wait;}

  /* ---------- Tables ---------- */
  .table-wrap{overflow:auto; border:1px solid var(--ink-200); border-radius:var(--r-panel); background:#fff;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; background:var(--ink-50); color:var(--ink-700); font-weight:700; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; padding:11px 14px; border-bottom:1px solid var(--ink-200); white-space:nowrap;}
  td{padding:11px 14px; border-bottom:1px solid var(--ink-100); vertical-align:middle;}
  tbody tr{transition:background .14s var(--ease-in);}
  tbody tr:hover{background:var(--steel-50);}
  tbody tr:last-child td{border-bottom:none;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--r-pill); font-size:10.5px;
    font-weight:700; letter-spacing:.02em; white-space:nowrap;}
  .badge-blue{background:rgba(40,58,143,.12); color:var(--st-blue);}
  .badge-green{background:rgba(28,138,75,.12); color:var(--st-green);}
  .badge-orange, .badge-yellow{background:rgba(232,131,10,.14); color:var(--st-orange);}
  .badge-red{background:rgba(214,69,69,.12); color:var(--st-red);}
  .badge-gray{background:var(--ink-100); color:var(--ink-500);}
  .provider-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:var(--r-pill); background:var(--ink-100); color:var(--ink-700); letter-spacing:.02em;}
  .provider-dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .provider-tag.p-aws{background:rgba(255,153,0,.14); color:#a35800;}
  .provider-tag.p-azure{background:rgba(0,120,212,.12); color:var(--azure);}
  .provider-tag.p-gcp{background:rgba(225,65,52,.12); color:var(--gcp);}

  /* ---------- Empty / skeleton ---------- */
  .empty-state{display:flex; flex-direction:column; align-items:center; gap:10px; padding:56px 20px; color:var(--ink-500); text-align:center;}
  .empty-state svg{width:48px; height:48px; color:var(--ink-300);}
  .skeleton{background:linear-gradient(90deg,var(--ink-100) 25%,var(--ink-50) 37%,var(--ink-100) 63%); background-size:400% 100%;
    animation:skel-shimmer 1.4s ease infinite; border-radius:6px;}
  @keyframes skel-shimmer{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}
  @media (prefers-reduced-motion:reduce){ .skeleton{animation:none;} }

  /* ---------- Tabs / accordion ---------- */
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--ink-200); margin-bottom:16px;}
  .tab-btn{padding:10px 16px; font-weight:700; font-size:13px; color:var(--ink-500); border:none; background:none;
    border-bottom:2px solid transparent; cursor:pointer; transition:color .14s var(--ease-in), border-color .14s var(--ease-in);}
  .tab-btn.is-active{color:var(--steel); border-bottom-color:var(--steel);}
  .accordion-item{border:1px solid var(--ink-200); border-radius:var(--r-panel); margin-bottom:10px; background:#fff; overflow:hidden;}
  .accordion-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;}
  .accordion-head:hover{background:var(--steel-50);}
  .accordion-body{padding:0 16px 16px; display:none; border-top:1px solid var(--ink-100);}
  .accordion-item.is-open .accordion-body{display:block;}
  .accordion-caret{transition:transform .18s var(--ease-in); color:var(--ink-500); flex:0 0 auto;}
  .accordion-item.is-open .accordion-caret{transform:rotate(90deg);}

  /* ---------- Chips ---------- */
  .chip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:var(--r-pill); background:var(--ink-100);
    color:var(--ink-700); font-size:12.5px; font-weight:600;}
  .chip.chip-locked{background:var(--steel-50); color:var(--steel);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,18,28,.5); display:flex; align-items:center; justify-content:center;
    z-index:300; padding:20px; animation:fade-in .18s var(--ease-in);}
  .modal{background:#fff; border-radius:var(--r-card); box-shadow:var(--shadow-lg); max-width:600px; width:100%; max-height:88vh;
    overflow:auto; padding:24px;}
  .modal h3{font-size:17px; font-weight:800; margin-bottom:16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  @keyframes fade-in{from{opacity:0;} to{opacity:1;}}

  /* ---------- Toast ---------- */
  .toast-container{position:fixed; bottom:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  .toast{background:var(--ink-900); color:#fff; font-size:13px; font-weight:600; padding:12px 16px; border-radius:var(--r-ctrl);
    box-shadow:var(--shadow-lg); max-width:320px; animation:toast-in .22s var(--ease-in);}
  .toast.toast-success{background:var(--st-green);}
  .toast.toast-error{background:var(--st-red);}
  .toast.is-out{opacity:0; transform:translateX(8px); transition:opacity .2s, transform .2s;}
  @keyframes toast-in{from{opacity:0; transform:translateX(12px);} to{opacity:1; transform:translateX(0);}}

  /* ---------- Dark surface (nav / auth backdrop) ---------- */
  .dark-surface{position:relative; background:var(--grad-steel); isolation:isolate;}
  .dark-surface::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size:24px 24px; -webkit-mask-image:radial-gradient(ellipse 60% 100% at 50% 0%, black, transparent 75%); mask-image:radial-gradient(ellipse 60% 100% at 50% 0%, black, transparent 75%); z-index:0; pointer-events:none;}
  .dark-surface::after{content:""; position:absolute; top:-60%; right:-8%; width:50%; height:220%; background:radial-gradient(circle, rgba(61,217,245,.28), transparent 70%); z-index:0; pointer-events:none; overflow:hidden;}
  .abc-nav{overflow:hidden;}

  /* ---------- Nav ---------- */
  .abc-nav{position:sticky; top:0; z-index:100; height:var(--nav-h); border-bottom:1px solid rgba(255,255,255,.16); box-shadow:var(--shadow-md);}
  .abc-nav__inner{position:relative; z-index:1; height:100%; display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .abc-nav__brand{display:flex; align-items:center; gap:8px; letter-spacing:-.01em;}
  .abc-nav__brand img{height:26px; width:auto; display:block;}
  .abc-nav__brand:hover{opacity:.92; text-decoration:none;}
  .abc-nav__links{display:flex; align-items:center; gap:6px; flex:1; justify-content:center;}
  .abc-nav__link{color:rgba(255,255,255,.72); font-weight:600; font-size:13.5px; padding:8px 12px; border-radius:var(--r-ctrl);
    border-bottom:2px solid transparent; cursor:pointer; transition:color .14s var(--ease-in), background .14s var(--ease-in);}
  .abc-nav__link:hover{color:#fff; text-decoration:none; background:rgba(255,255,255,.08);}
  .abc-nav__link.is-active{color:#fff; border-bottom-color:var(--signal);}
  .abc-nav__user{color:#fff; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; white-space:nowrap;}
  .abc-nav__user-dot{width:8px; height:8px; border-radius:50%; background:var(--whatsapp);}
  .abc-nav__burger{display:none; background:none; border:none; color:#fff; padding:6px; cursor:pointer;}

  /* ---------- Auth pages ---------- */
  .auth-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-box{position:relative; z-index:1; background:#fff; border:1px solid var(--ink-200); border-radius:var(--r-card); box-shadow:var(--shadow-lg);
    padding:44px 38px; max-width:400px; width:100%; text-align:center;}
  .auth-box .mark{width:72px; height:72px; border-radius:18px; background:var(--ink-50); display:flex; align-items:center;
    justify-content:center; margin:0 auto 18px; padding:10px;}
  .auth-box .mark img{width:100%; height:100%; object-fit:contain;}
  .auth-box h1{font-size:19px; font-weight:800;}
  .auth-box .subtitle{font-size:13px; color:var(--ink-500); margin-top:4px;}
  .auth-box .note{font-size:11.5px; color:var(--ink-300); margin-top:22px;}
  .spinner{width:26px; height:26px; border-radius:50%; border:3px solid var(--ink-200); border-top-color:var(--steel);
    animation:spin .8s linear infinite; margin:20px auto 0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:860px){
    .abc-nav__links{display:none;}
    .abc-nav__burger{display:flex;}
    .abc-nav.is-open .abc-nav__links{display:flex; position:absolute; top:var(--nav-h); left:0; right:0; background:var(--steel);
      flex-direction:column; align-items:stretch; padding:8px 16px 14px; box-shadow:var(--shadow-md);}
    .abc-nav.is-open .abc-nav__link{padding:12px 8px;}
    .page-header{align-items:flex-start;}
    .filters-bar{flex-direction:column; align-items:stretch;}
    .filters-bar .field{min-width:0;}
  }
</style>
