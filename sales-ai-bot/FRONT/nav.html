  }
  function fmtDayLabel(ts){
    var d=new Date(parseInt(ts,10)), t=new Date();

    var y=new Date(t); y.setDate(t.getDate()-1);

  function updateLeadPreview(telf,texto,origen){

  }

  function mockBackend(fn,args,onOk,onErr){
    setTimeout(function(){
      try{
        switch(fn){
          case 'getBaseUrl': onOk('#'); break;
          case 'obtenerUsuarioActual': onOk({ success:true, email:'advisor@example.com', rol:'asesor', nombre:'Asesor Demo' }); break;
          case 'getTecnologiasYProviders': onOk({ AWS:['AWS'], AZURE:['AZURE'], GCP:['GCP'] }); break;
          case 'getLeads': {
            var filtros = args[0]||{}; var list = mockLeads.slice();
            if (filtros.provider){ list = list.filter(function(l){ return l.PROVIDER===filtros.provider; }); }
            list.sort(function(a,b){ return (parseInt(b.ULTIMO_MSG_TS||b.UPDATED_AT||'0',10)) - (parseInt(a.ULTIMO_MSG_TS||a.UPDATED_AT||'0',10)); });
            onOk(list); break;
          }
          case 'getEmbudoEstados': {
            var total = mockLeads.length; var byEstado = {};
            mockLeads.forEach(function(l){ byEstado[l.ESTADO_BOT]=(byEstado[l.ESTADO_BOT]||0)+1; });
            var order = ['INICIO','NO_E_NUBE','NO_E_CERT','NO_E_URGENCIA','NO_CONFIRMO_MEET','CONFIRMO_MEET','RECONFIRMO_MEET','MAS_DE_60_DIAS','REMARKETING_FALLIDO'];
            var estados = order.map(function(id){
              var cant = byEstado[id]||0;
              return { id:id, label:estadoInfo(id).label, cantidad:cant, porcentaje: total? Math.round(cant/total*1000)/10 : 0 };

            onOk({ total:total, desde:'', hasta:'', estados:estados }); break;
          }
          case 'getConversacion': {
            var telefono = args[0];
            onOk({ telefono:telefono, mensajes:(mockConvs[telefono]||[]).slice() }); break;
          }
          case 'enviarMensajeManual': {
            var telf=args[0], texto=args[1];
            (mockConvs[telf]=mockConvs[telf]||[]).push({ timestamp:String(Date.now()), origen:'asesor', tipo:'text', contenido:texto });
            updateLeadPreview(telf,texto,'asesor'); onOk({ success:true }); break;
          }
          case 'enviarArchivoManual': {
            var telf2=args[0], mime=args[2]||'', fname=args[3]||'archivo';
            var tipo = mime.indexOf('image')===0?'image':mime.indexOf('video')===0?'video':'document';
            (mockConvs[telf2]=mockConvs[telf2]||[]).push({ timestamp:String(Date.now()), origen:'asesor', tipo:tipo, contenido:'local://enviado|'+fname });
            updateLeadPreview(telf2,'['+(tipo==='image'?'Imagen':tipo==='video'?'Video':'Documento')+']','asesor');
            onOk({ success:true }); break;
          }
          case 'getSignedUrl': onOk(''); break;
          case 'getTraduccionesPayload': onOk({ 'btn_CLOUD':'CLOUD ☁️', 'cert_CLF':'Cloud Practitioner' }); break;
          case 'cambiarModoLead': {
            var telf3=args[0], ba=args[1], ia=args[2];
            var lead=mockLeads.find(function(l){return l.TELF===telf3;});
            if(lead){ lead.BOT_ACTIVO=String(ba); lead.IA_ACTIVA=String(ia); }
            onOk({ success:true }); break;
          }
          case 'toggleIALead': {
            var lead2=mockLeads.find(function(l){return l.TELF===args[0];});
            if(lead2) lead2.IA_ACTIVA = args[1]?'1':'0';
            onOk({ success:true }); break;
          }
          case 'toggleBotLead': {
            var lead3=mockLeads.find(function(l){return l.TELF===args[0];});
            if(lead3) lead3.BOT_ACTIVO = args[1]?'1':'0';
            onOk({ success:true }); break;
          }
          case 'getMensajes': {
            var arr=[]; var i=1;
            for (var k in mockFlujo.mensajes){ arr.push({ fila:i++, clave:k, texto:mockFlujo.mensajes[k] }); }
            onOk(arr); break;
          }
          case 'updateMensaje': onOk({ success:true }); break;
          case 'getAllPrompts': onOk(mockPrompts.slice()); break;
          case 'getPromptActual': {
            var actual = mockPrompts.find(function(p){return p.rollout>0;}) || mockPrompts[0];
            onOk({ prompt:actual.prompt, version:actual.version, rollout:actual.rollout }); break;
          }
          case 'guardarNuevoPrompt': {
            var v = mockPrompts.length + 1;
            mockPrompts.unshift({ fila:v, version:v, prompt:args[0], rollout:parseInt(args[1]||0,10), fecha:String(Date.now()) });
            onOk({ success:true, version:v }); break;
          }
          case 'eliminarPrompt': {
            mockPrompts = mockPrompts.filter(function(p){return p.fila!==args[0];});
            onOk({ success:true }); break;
          }
          case 'getCatalogoData': {
            var sec = mockCatalogo[args[0]] || { headers:[], rows:[] };
            onOk({ headers:sec.headers.slice(), rows:sec.rows.map(function(r){return r.slice();}) }); break;
          }
          case 'guardarCatalogoData': {
            var data = args[0]||{};
            mockCatalogo[data.seccion] = { headers:data.headers, rows:data.rows };
            onOk({ success:true }); break;
          }
          case 'getFlujoConMensajes': onOk(JSON.parse(JSON.stringify(mockFlujo))); break;
          case 'guardarFlujoCompleto': { mockFlujo.flujo = args[0]; onOk({ success:true }); break; }
          case 'guardarMensajesSistema': { mockFlujo.mensajes = (args[0]&&args[0].mensajes) || args[0] || mockFlujo.mensajes; onOk({ success:true }); break; }
          case 'getDisparadores': onOk(mockFlujo.disparadores.slice()); break;
          case 'guardarDisparadores': { mockFlujo.disparadores = args[0]; onOk({ success:true }); break; }
          default: onErr({ message:'Función mock no implementada: '+fn });
        }
      } catch(e){ onErr(e); }

/* ===================== Nav: navegación, resaltado, usuario, burger ===================== */
function navegar(page, extraQuery){
  ABC.callServer('getBaseUrl', [], function(base){
    window.top.location.href = base + '?page=' + page + (extraQuery ? '&' + extraQuery : '');
  });
}

  Array.prototype.forEach.call(document.querySelectorAll('.abc-nav__link'), function(a){
    a.addEventListener('click', function(){ navegar(a.getAttribute('data-page')); });
  });
  var burger = document.getElementById('abcNavBurger');
  var navEl = document.getElementById('abcNav');
  if (burger) burger.addEventListener('click', function(){ navEl.classList.toggle('is-open'); });

  function highlight(page){
    Array.prototype.forEach.call(document.querySelectorAll('.abc-nav__link'), function(a){
      a.classList.toggle('is-active', a.getAttribute('data-page') === page);
    });
  }
  var fallbackPage = document.body.getAttribute('data-page') || '';
  if (window.google && google.script && google.script.url && google.script.url.getLocation){
    google.script.url.getLocation(function(loc){ highlight((loc.parameter && loc.parameter.page) || fallbackPage); });
  } else {
    highlight(fallbackPage);
  }

  ABC.callServer('obtenerUsuarioActual', [], function(res){
    var el = document.getElementById('nav-user');
    if (!el) return;
    if (res && res.success){
      el.innerHTML = '<span class="abc-nav__user-dot"></span><span>' + ABC.escHtml(res.nombre || res.email) + '</span>';
    } else {
      el.innerHTML = '<span>—</span>';
    }
  }, function(){ var el=document.getElementById('nav-user'); if (el) el.innerHTML='<span>—</span>'; });
})();
</script>
